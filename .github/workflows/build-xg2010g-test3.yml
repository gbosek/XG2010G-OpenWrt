name: Build XG2010G Test-3 UBI+LAN+PON+NPU

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-xg2010g-test3.yml'
      - 'patches/**'
      - 'packages/luci-app-xg2010g/**'
  workflow_dispatch:

concurrency:
  group: xg2010g-test3-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: https://github.com/naoki66/ImmortalWrt-for-Gemtek-XG2010G.git
  SOURCE_COMMIT: b6bd44a7caf1b6979f1cb30433e33637b69e791e

jobs:
  build-test3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc curl kmod binutils device-tree-compiler

      - name: Clone XG2010G Linux 6.18.44 baseline
        run: |
          git clone --filter=blob:none "$SOURCE_REPO" src
          cd src
          git checkout "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          grep -R -q '6\.18\.44' include target/linux
          test -f target/linux/airoha/dts/an7581-gemtek-xg2010g.dts
          printf 'source_commit=%s\n' "$(git rev-parse HEAD)" | tee ../source-baseline-test3.txt

      - name: Add Test-3 PON/NPU LuCI app
        run: |
          cp -a packages/luci-app-xg2010g src/package/luci-app-xg2010g
          test -f src/package/luci-app-xg2010g/htdocs/luci-static/resources/view/xg2010g/pon.js
          test -f src/package/luci-app-xg2010g/htdocs/luci-static/resources/view/xg2010g/npu.js
          test -x src/package/luci-app-xg2010g/root/usr/libexec/xg2010g-status || chmod +x src/package/luci-app-xg2010g/root/usr/libexec/xg2010g-status

      - name: Apply RTL8261 Test-2 fix
        run: |
          cd src
          cp ../patches/743-net-phy-realtek-xg2010g-d2dc-rtk-serdes.patch \
            target/linux/generic/pending-6.18/744-net-phy-realtek-xg2010g-serdes-tuning.patch
          patch -p1 < ../patches/746-airoha-xg2010g-enable-rtl8261-serdes-tuning.patch

      - name: Restore working XG2010G UBI geometry deterministically
        shell: bash
        run: |
          set -euo pipefail
          cd src
          DTS=target/linux/airoha/dts/an7581-gemtek-xg2010g.dts
          cp "$DTS" ../test3-dts.before
          python3 - "$DTS" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          start = s.index('&spi_nand {')
          end = s.index('&pcie0', start)
          replacement = '''&spi_nand {
          \tpartitions {
          \t\tcompatible = "fixed-partitions";
          \t\t#address-cells = <1>;
          \t\t#size-cells = <1>;

          \t\tbl2@0 {
          \t\t\tlabel = "bl2";
          \t\t\treg = <0x00000000 0x00020000>;
          \t\t\tread-only;
          \t\t};

          \t\tubi@20000 {
          \t\t\tlabel = "ubi";
          \t\t\treg = <0x00020000 0x00000000>;
          \t\t\tcompatible = "linux,ubi";

          \t\t\tvolumes {
          \t\t\t\tubi-volume-factory {
          \t\t\t\t\tvolname = "factory";

          \t\t\t\t\tnvmem-layout {
          \t\t\t\t\t\tcompatible = "fixed-layout";
          \t\t\t\t\t\t#address-cells = <1>;
          \t\t\t\t\t\t#size-cells = <1>;

          \t\t\t\t\t\tmacaddr_factory_3e: macaddr@3e {
          \t\t\t\t\t\t\tcompatible = "mac-base";
          \t\t\t\t\t\t\treg = <0x3e 0x6>;
          \t\t\t\t\t\t\t#nvmem-cell-cells = <1>;
          \t\t\t\t\t\t};

          \t\t\t\t\t\tpon_calibration: calibration@12000 {
          \t\t\t\t\t\t\treg = <0x12000 0x200>;
          \t\t\t\t\t\t};
          \t\t\t\t\t};
          \t\t\t\t};

          \t\t\t\tubi_fit: ubi-volume-fit {
          \t\t\t\t\tvolname = "fit";
          \t\t\t\t};

          \t\t\t\tubi-volume-fip {
          \t\t\t\t\tvolname = "fip";
          \t\t\t\t};

          \t\t\t\tubi_env: ubi-volume-ubootenv {
          \t\t\t\t\tvolname = "ubootenv";
          \t\t\t\t};

          \t\t\t\tubi_env2: ubi-volume-ubootenv2 {
          \t\t\t\t\tvolname = "ubootenv2";
          \t\t\t\t};
          \t\t\t};
          \t\t};
          \t};
          };

          &ubi_env {
          \tnvmem-layout {
          \t\tcompatible = "u-boot,env-redundant-bool-layout";
          \t};
          };

          &ubi_env2 {
          \tnvmem-layout {
          \t\tcompatible = "u-boot,env-redundant-bool-layout";
          \t};
          };

          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          grep -A4 'bl2@0' "$DTS" | grep -q 'reg = <0x00000000 0x00020000>;'
          grep -A5 'ubi@20000' "$DTS" | grep -q 'reg = <0x00020000 0x00000000>;'
          grep -q 'volname = "factory";' "$DTS"
          grep -q 'reg = <0x12000 0x200>;' "$DTS"
          grep -q 'ubi-volume-ubootenv' "$DTS"
          grep -q 'ubi-volume-ubootenv2' "$DTS"
          ! grep -q 'reserved-bmt@1be00000' "$DTS"
          ! grep -q 'ubi@600000' "$DTS"
          git diff --check

      - name: Apply LAN2 2.5G mapping
        run: |
          cd src
          patch -p1 < ../patches/745-airoha-xg2010g-fix-lan1-lan2-2p5g-map.patch
          DTS=target/linux/airoha/dts/an7581-gemtek-xg2010g.dts
          grep -A8 '&gdm4' "$DTS" | grep -q 'openwrt,netdev-name = "lan2";'
          grep -A8 '&gdm4' "$DTS" | grep -q 'phy-mode = "2500base-x";'
          git diff --check
          git diff -- "$DTS" | tee ../test3-dts.diff

      - name: Install feeds
        run: |
          cd src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Test-3
        run: |
          cd src
          rm -f .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xg2010g=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-xg2010g=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_ubi-utils=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_VERSION_DIST="XG2010G-Test3"
          CONFIG_VERSION_NUMBER="6.18.44-ubi-lan-pon-npu"
          EOF
          make defconfig
          grep -q '^CONFIG_PACKAGE_luci-app-xg2010g=y$' .config

      - name: Download sources
        run: |
          cd src
          make download -j$(nproc)

      - name: Preflight kernel and DT
        shell: bash
        run: |
          set -o pipefail
          cd src
          make -j1 V=s target/linux/prepare 2>&1 | tee ../kernel-preflight-test3.log
          KDIR=build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581/linux-6.18.44
          test -d "$KDIR"
          grep -q 'patch_rtk_serdes' "$KDIR/drivers/net/phy/realtek/realtek.h"
          grep -q '0x80aa' "$KDIR/drivers/net/phy/realtek/realtek_main.c"
          grep -q '0x5078' "$KDIR/drivers/net/phy/realtek/realtek_main.c"

      - name: Build Test-3 firmware
        shell: bash
        run: |
          set -o pipefail
          cd src
          if ! make -j2 world 2>&1 | tee ../build-test3.log; then
            echo 'Parallel build failed; rerunning target/linux serially with V=s.' | tee ../kernel-error-test3.log
            make -j1 V=s target/linux/compile 2>&1 | tee -a ../kernel-error-test3.log
            exit 1
          fi

      - name: Collect Test-3 artifacts and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp build-test3.log out/ 2>/dev/null || true
          cp kernel-preflight-test3.log out/ 2>/dev/null || true
          cp kernel-error-test3.log out/ 2>/dev/null || true
          cp source-baseline-test3.txt test3-dts.diff out/ 2>/dev/null || true
          find src/bin/targets/airoha/an7581 -maxdepth 1 -type f -name '*.itb' -exec cp -v {} out/ \; 2>/dev/null || true
          find src/build_dir -type f \( -name '*gemtek*xg2010g*.dtb' -o -name '*xg2010g*.dtb' \) -exec cp -v {} out/xg2010g-test3.dtb \; -quit 2>/dev/null || true
          if [ -f out/xg2010g-test3.dtb ]; then
            dtc -I dtb -O dts out/xg2010g-test3.dtb > out/xg2010g-test3.decompiled.dts || true
            grep -n -E 'bl2@0|ubi@20000|ubootenv|lan1|lan2|2500base-x|ethernet-phy@8|ethernet-phy@5|patch-rtk-serdes|xpon|pon-data-path|npu|qdma' \
              out/xg2010g-test3.decompiled.dts > out/xg2010g-test3.dt-check.txt || true
          fi
          find src/bin -type f -name '*luci-app-xg2010g*.ipk' -exec cp -v {} out/ \; 2>/dev/null || true
          (cd out && sha256sum *.itb *.ipk 2>/dev/null || true) > out/sha256sums.txt
          cat > out/TEST3-SAFETY.txt <<'EOF'
          TEST-3 remains INITRAMFS-VALIDATION-ONLY until real hardware confirms:
          1. UBI attaches without reserved_pebs/vtbl_check errors.
          2. /sys/class/net contains Ethernet interfaces (not only lo).
          3. 1fb50000.ethernet and 1fb58000.switch no longer remain deferred.
          4. LAN2 negotiates both 1G and 2.5G with traffic.
          5. RTL8261BE 10G gets carrier and passes traffic.
          6. PON and NPU/PPE/QDMA remain functional.
          Do not use sysupgrade or force-upgrade before these checks pass.
          EOF

      - name: Upload Test-3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xg2010g-test3-ubi-lan-pon-npu
          path: out/
          retention-days: 14

      - name: Safety gate
        if: always()
        run: |
          echo 'TEST-3 is initramfs-validation-only. DO NOT FLASH SYSUPGRADE YET.'
