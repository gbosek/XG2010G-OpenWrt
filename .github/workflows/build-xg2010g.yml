name: Build XG2010G Test-1 Candidate

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-xg2010g.yml'
      - 'source.lock'
  workflow_dispatch:

concurrency:
  group: xg2010g-test1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: https://github.com/naoki66/ImmortalWrt-for-Gemtek-XG2010G.git
  SOURCE_COMMIT: d2dc130d7f8341741df04eaaf5fd4c74dcc447d7
  CONFIG_REPO_RAW: https://raw.githubusercontent.com/naoki66/ImmortalWrt-for-Gemtek-XG2010G/015b95c23e4475ba6a4626ab38115b2690dbd3f1/config.seed
  RTL_FIX_REPO_RAW: https://raw.githubusercontent.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G/b7c3ce5ecc6f58fb3e285bc2b7b67d9735ab33e5/target/linux/airoha/patches-6.18

jobs:
  build-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc curl kmod binutils

      - name: Clone matching XG2010G source baseline
        run: |
          git clone --filter=blob:none "$SOURCE_REPO" src
          cd src
          git checkout "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf 'source_commit=%s\n' "$(git rev-parse HEAD)" | tee ../source-baseline.txt
          git show -s --format='source_date=%cI%nsource_subject=%s' HEAD | tee -a ../source-baseline.txt

      - name: Verify matching kernel baseline before fixes
        run: |
          cd src
          grep -q '^LINUX_VERSION-6.18 = 6.18.44$' include/kernel-6.18 2>/dev/null || \
            grep -R -q '6\.18\.44' include target/linux
          test -f target/linux/generic/pending-6.18/742-net-phy-realtek-add-5G-and-10G-PHY-support.patch
          grep -q 'rtl8261be_match_phy_device' target/linux/generic/pending-6.18/742-net-phy-realtek-add-5G-and-10G-PHY-support.patch

      - name: Inject RTL8261 Test-1 fixes 743 and 744
        run: |
          cd src
          curl -fL "$RTL_FIX_REPO_RAW/743-net-phy-realtek-restore-optional-RTK-SerDes-patch.patch" \
            -o target/linux/airoha/patches-6.18/743-net-phy-realtek-restore-optional-RTK-SerDes-patch.patch
          curl -fL "$RTL_FIX_REPO_RAW/744-net-phy-realtek-reapply-RTK-SerDes-after-aneg.patch" \
            -o target/linux/airoha/patches-6.18/744-net-phy-realtek-reapply-RTK-SerDes-after-aneg.patch
          grep -q 'realtek,patch-rtk-serdes' target/linux/airoha/patches-6.18/743-net-phy-realtek-restore-optional-RTK-SerDes-patch.patch
          grep -q '0x80aa' target/linux/airoha/patches-6.18/743-net-phy-realtek-restore-optional-RTK-SerDes-patch.patch
          grep -q '0x5078' target/linux/airoha/patches-6.18/743-net-phy-realtek-restore-optional-RTK-SerDes-patch.patch
          grep -q '10000, 12000' target/linux/airoha/patches-6.18/744-net-phy-realtek-reapply-RTK-SerDes-after-aneg.patch

      - name: Install feeds
        run: |
          cd src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure XG2010G matching-baseline build
        run: |
          cd src
          curl -fL "$CONFIG_REPO_RAW" -o .config
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xg2010g=y$' .config
          sed -i -e '/^CONFIG_VERSION_DIST=/d' -e '/^# CONFIG_VERSION_DIST is not set$/d' \
                 -e '/^CONFIG_VERSION_NUMBER=/d' -e '/^# CONFIG_VERSION_NUMBER is not set$/d' .config
          echo 'CONFIG_VERSION_DIST="XG2010G-Test1"' >> .config
          echo 'CONFIG_VERSION_NUMBER="d2dc130d-minimal-rtl8261"' >> .config
          make defconfig

      - name: Download sources
        run: |
          cd src
          make download -j$(nproc)

      - name: Build matching-baseline firmware and RTL8261 module
        shell: bash
        run: |
          set -o pipefail
          cd src
          if ! make -j2 world 2>&1 | tee ../build.log; then
            echo 'Parallel build failed; rerunning target/linux serially with V=s for diagnosis.' | tee ../kernel-error.log
            make -j1 V=s target/linux/compile 2>&1 | tee -a ../kernel-error.log
            exit 1
          fi

      - name: Collect candidate artifacts and ABI diagnostics
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp kernel-error.log out/ 2>/dev/null || true
          cp source-baseline.txt out/ 2>/dev/null || true
          find src/bin/targets/airoha/an7581 -maxdepth 1 -type f -name '*.itb' -exec cp -v {} out/ \; 2>/dev/null || true
          find src/build_dir -type f -name 'realtek.ko' -exec cp -v {} out/realtek-test1.ko \; -quit 2>/dev/null || true
          if [ -f out/realtek-test1.ko ]; then
            modinfo out/realtek-test1.ko | tee out/realtek-test1.modinfo.txt || true
            sha256sum out/realtek-test1.ko | tee out/realtek-test1.sha256
            stat -c 'size=%s' out/realtek-test1.ko | tee out/realtek-test1.size.txt
            nm -u out/realtek-test1.ko | sed 's/^.* U //' | sort -u | tee out/realtek-test1.undefined.txt || true
            strings out/realtek-test1.ko | grep -E 'realtek,patch-rtk-serdes|pulsed RTK SerDes|RTL8261BE|RTL8261N' | sort -u | tee out/realtek-test1.strings.txt || true
          fi
          (cd out && sha256sum *.itb 2>/dev/null || true) > out/itb.sha256

      - name: Upload matching-baseline build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xg2010g-test1-d2dc130d
          path: out/
          retention-days: 14

      - name: Safety note
        if: always()
        run: |
          echo 'Reference build only: its full sysupgrade is NOT the flash target.'
          echo 'Final Test-1 must retain the user known-good kernel/PON/PPE/NPU stack.'
          echo 'Only a module proven compatible with the known-good 6.18.44 baseline plus the minimal DT property may be transplanted.'
